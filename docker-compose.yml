services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wachoo
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: wachoo
    ports:
      - "5432:5432"
    volumes:
      - wachoo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wachoo -d wachoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - wachoo-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wachoo-postgres:
  wachoo-redis:
